schema_version: '1.0'
preset:
  id: 'vibes'
  name: 'Vibes scoped agent workflow'
  version: '1.0.0'
  description: 'Project command guidance with explicit scope and completion boundaries'
  author: 'Vibes-college'
  repository: 'https://github.com/Vibes-college/Vibes'
  license: 'MIT'
requires:
  speckit_version: '>=1.0.4'
provides:
  templates:
    - type: 'command'
      name: 'speckit.specify'
      file: 'commands/speckit.specify.md'
      description: '为新功能或重要变更创建、更新尚未冻结的需求规格；小修复不自动启动。'
      replaces: 'speckit.specify'
    - type: 'command'
      name: 'speckit.plan'
      file: 'commands/speckit.plan.md'
      description: '为已有规格制定实现计划；仅研究影响实现的未决问题，按需生成附加产物。'
      replaces: 'speckit.plan'
    - type: 'command'
      name: 'speckit.clarify'
      file: 'commands/speckit.clarify.md'
      description: '澄清未冻结规格中影响范围、权限或实现正确性的未决事项；已明确时直接结束。'
      replaces: 'speckit.clarify'
    - type: 'command'
      name: 'speckit.checklist'
      file: 'commands/speckit.checklist.md'
      description: '审查当前spec的需求完整性、清晰度与一致性；不用于功能测试或发布验收清单。'
      replaces: 'speckit.checklist'
    - type: 'command'
      name: 'speckit.analyze'
      file: 'commands/speckit.analyze.md'
      description: '只读检查已有spec、plan与tasks的矛盾、遗漏和任务覆盖，输出具体修正建议。'
      replaces: 'speckit.analyze'
    - type: 'command'
      name: 'speckit.tasks'
      file: 'commands/speckit.tasks.md'
      description: '将已确认范围的spec与plan转为可执行且按依赖排序的任务；保留已有有效进度。'
      replaces: 'speckit.tasks'
    - type: 'command'
      name: 'speckit.implement'
      file: 'commands/speckit.implement.md'
      description: '执行当前未冻结tasks，修复本任务导致的失败并完成必要验证与文档；遵守已约定审阅点。'
      replaces: 'speckit.implement'
    - type: 'command'
      name: 'speckit.converge'
      file: 'commands/speckit.converge.md'
      description: '核对已实施功能与spec、plan、tasks的实际缺口，仅追加尚未记录的剩余工作。'
      replaces: 'speckit.converge'
    - type: 'command'
      name: 'speckit.constitution'
      file: 'commands/speckit.constitution.md'
      description: '按明确的规则变更更新项目宪章，保留现有结构、有效原则与必要同步。'
      replaces: 'speckit.constitution'
    - type: 'command'
      name: 'speckit.taskstoissues'
      file: 'commands/speckit.taskstoissues.md'
      description: '用户明确要求时，将当前tasks转为本仓库GitHub issues，并避免重复创建。'
      replaces: 'speckit.taskstoissues'
