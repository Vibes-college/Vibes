name: Project checks
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scope:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - id: scope
        run: npm run ci:scope
        env:
          CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
  verify:
    needs: scope
    name: verify
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a successful scope classification
        run: |
          test "$SCOPE_RESULT" = success
          case "$CHECK_SCOPE" in docs|tools|full) ;; *) exit 1 ;; esac
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_SCOPE: ${{ needs.scope.outputs.scope }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - if: needs.scope.outputs.scope == 'full'
        run: npx playwright install --with-deps chromium webkit
      - if: needs.scope.outputs.scope == 'docs'
        run: npm run docs:check && npm run format:check
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - if: needs.scope.outputs.scope == 'tools'
        run: npm run check
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - if: needs.scope.outputs.scope == 'full'
        run: npm run verify
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - uses: actions/upload-artifact@v4
        if: failure() && needs.scope.outputs.scope == 'full'
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  budget:
    needs: scope
    name: budget
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require a successful scope classification
        run: |
          test "$SCOPE_RESULT" = success
          case "$CHECK_SCOPE" in docs|tools|full) ;; *) exit 1 ;; esac
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_SCOPE: ${{ needs.scope.outputs.scope }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - if: needs.scope.outputs.scope == 'full'
        run: npm ci
      - if: needs.scope.outputs.scope == 'full'
        run: npm run budget
      - if: needs.scope.outputs.scope != 'full'
        run: echo "No website output changed; resource budget is not applicable."
  document-health:
    name: Weekly document health
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm run docs:check
