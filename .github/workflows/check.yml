name: Project checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  scope:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      mode: ${{ steps.scope.outputs.mode }}
      base: ${{ steps.scope.outputs.base }}
      acceptance: ${{ steps.acceptance.outputs.acceptance }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - id: paths
        name: Resolve cumulative base and path candidate
        run: npm run ci:scope -- --paths-only
        env:
          CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - name: Install locked parser only for content candidates
        if: steps.paths.outputs.scope == 'content'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - id: scope
        run: npm run ci:scope
        env:
          CHECK_RESOLVED_BASE: ${{ steps.paths.outputs.base }}
      - id: acceptance
        if: steps.scope.outputs.mode == 'required' && steps.scope.outputs.scope == 'full' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node --experimental-strip-types scripts/ci-acceptance.ts resolve
        env:
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: scope
    name: verify
    if: always() && github.event_name != 'schedule' && needs.scope.outputs.mode != 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      budget: ${{ steps.resource_budget.outputs.budget || steps.no_budget.outputs.budget }}
    steps:
      - name: Require a successful scope classification
        run: |
          test "$SCOPE_RESULT" = success
          test "$CHECK_MODE" = required
          case "$CHECK_SCOPE" in docs|tools|content|full) ;; *) exit 1 ;; esac
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_MODE: ${{ needs.scope.outputs.mode }}
          CHECK_SCOPE: ${{ needs.scope.outputs.scope }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Restore native static output for content
        id: native_cache
        if: needs.scope.outputs.scope == 'content'
        uses: actions/cache/restore@v4
        with:
          path: .scratch/paseo-webui/artifacts/product
          key: native-product-v1-${{ runner.os }}-${{ hashFiles('third_party/paseo-webui/**', 'scripts/paseo-webui-*.ts', 'src/features/paseo-webui/build-config.ts', 'src/features/paseo-webui/asset-contract.ts', 'package-lock.json') }}
      - name: Resolve verification lane
        id: lane
        run: |
          LANE="$SCOPE"
          if [ "$LANE" = content ] && [ "$CACHE_HIT" != true ]; then
            echo "Native output unavailable; falling back to full verification."
            LANE=full
          fi
          echo "scope=$LANE" >> "$GITHUB_OUTPUT"
          echo "Verification lane: $LANE" >> "$GITHUB_STEP_SUMMARY"
        env:
          SCOPE: ${{ needs.scope.outputs.scope }}
          CACHE_HIT: ${{ steps.native_cache.outputs.cache-hit }}
      - if: steps.lane.outputs.scope == 'full' && needs.scope.outputs.acceptance != 'reuse'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.lane.outputs.scope == 'content'
        run: npx playwright install --with-deps chromium
      - if: needs.scope.outputs.scope == 'docs'
        run: npm run docs:check && npm run format:check
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - if: needs.scope.outputs.scope == 'tools'
        run: npm run check
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - name: Prepare Paseo for full verification
        id: native_full
        if: steps.lane.outputs.scope == 'full' && needs.scope.outputs.acceptance != 'reuse'
        run: npm run paseo:ci
      - name: Run full regression
        id: regression_full
        if: steps.lane.outputs.scope == 'full' && needs.scope.outputs.acceptance != 'reuse'
        run: npm run verify
        env:
          SITE_URL: https://vibes.college
          VIBES_DEPLOY: '1'
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - name: Prepare verified production source
        if: needs.scope.outputs.scope == 'full' && needs.scope.outputs.acceptance == 'reuse'
        run: npm run paseo:production && npm run check
        env:
          CI_ACCEPTANCE_REUSED: 'true'
          DOCS_BASE_REF: ${{ github.event.before || 'origin/main' }}
      - name: Validate content and project source
        if: steps.lane.outputs.scope == 'content'
        run: npm run check
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
      - name: Build and check resource budget
        id: resource_budget
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'content'
        run: |
          npm run budget
          echo "budget=passed" >> "$GITHUB_OUTPUT"
        env:
          SITE_URL: https://vibes.college
          VIBES_DEPLOY: '1'
      - id: no_budget
        if: needs.scope.outputs.scope == 'docs' || needs.scope.outputs.scope == 'tools'
        run: |
          echo "No website output changed; resource budget is not applicable."
          echo "budget=not-applicable" >> "$GITHUB_OUTPUT"
      - name: Validate production files and policies
        if: needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'content'
        run: node --experimental-strip-types scripts/release-preflight.ts
      - name: Smoke test content output
        if: steps.lane.outputs.scope == 'content'
        run: npx playwright test --config playwright.content.config.ts
        env:
          CONTENT_BASE_REF: ${{ needs.scope.outputs.base }}
      - name: Save native output only after main verification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lane.outputs.scope == 'full'
        uses: actions/cache/save@v4
        with:
          path: .scratch/paseo-webui/artifacts/product
          key: native-product-v1-${{ runner.os }}-${{ hashFiles('third_party/paseo-webui/**', 'scripts/paseo-webui-*.ts', 'src/features/paseo-webui/build-config.ts', 'src/features/paseo-webui/asset-contract.ts', 'package-lock.json') }}
      - name: Record full PR acceptance
        if: github.event_name == 'pull_request' && needs.scope.outputs.scope == 'full'
        run: node --experimental-strip-types scripts/ci-acceptance.ts record
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CI_NATIVE_VERIFIED: ${{ steps.native_full.outcome }}
          CI_FULL_VERIFIED: ${{ steps.regression_full.outcome }}
          CI_BUDGET_PASSED: ${{ steps.resource_budget.outcome }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && needs.scope.outputs.scope == 'full'
        with:
          name: acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/ci-acceptance/acceptance.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'content')
        run: node --experimental-strip-types scripts/release-artifact.ts
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'content')
        with:
          name: production-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && (needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'content')
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  budget:
    needs: [scope, verify]
    name: budget
    if: always() && github.event_name != 'schedule' && needs.scope.outputs.mode != 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the budget result from this verification
        run: |
          test "$SCOPE_RESULT" = success
          test "$CHECK_MODE" = required
          test "$VERIFY_RESULT" = success
          case "$CHECK_SCOPE" in
            full|content) test "$BUDGET_RESULT" = passed ;;
            docs|tools) test "$BUDGET_RESULT" = not-applicable ;;
            *) exit 1 ;;
          esac
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECK_MODE: ${{ needs.scope.outputs.mode }}
          CHECK_SCOPE: ${{ needs.scope.outputs.scope }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUDGET_RESULT: ${{ needs.verify.outputs.budget }}
  draft-check:
    name: Draft progress (not release acceptance)
    needs: scope
    if: needs.scope.outputs.mode == 'draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - if: needs.scope.outputs.scope == 'docs'
        run: npm run docs:check && npm run format:check
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - if: needs.scope.outputs.scope != 'docs'
        run: npm run check
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha }}
  deploy:
    name: Deploy and verify production
    needs: [scope, verify, budget]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.scope.outputs.scope == 'full' || needs.scope.outputs.scope == 'content')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production-vibes-college
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://vibes.college
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-${{ github.sha }}
          path: dist/
      - run: node --experimental-strip-types scripts/release-ci.ts
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          BUDGET_RESULT: ${{ needs.budget.result }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ github.sha }}
          path: resources/evidence/releases/
          retention-days: 90
  document-health:
    name: Weekly document health
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: npm run docs:check
